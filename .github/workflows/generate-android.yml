name: Generate Android Platform

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform
        run: |
          flutter create \
            --platforms=android \
            --project-name hse_final_project \
            --org com.hseinspection \
            .

      - name: Set compatible Android versions
        run: |
          sed -i -E \
            's/(id "com\.android\.application" version ")[^"]+/\18.1.0/' \
            android/settings.gradle

          sed -i -E \
            's/(id "org\.jetbrains\.kotlin\.android" version ")[^"]+/\11.9.24/' \
            android/settings.gradle

          sed -i \
            's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' \
            android/app/build.gradle

          sed -i \
            's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' \
            android/app/build.gradle

          sed -i \
            's/minSdk = flutter.minSdkVersion/minSdk = 21/' \
            android/app/build.gradle

          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Verify generated configuration
        run: |
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradlew

          echo "===== android/settings.gradle ====="
          cat android/settings.gradle

          echo "===== android/app/build.gradle ====="
          cat android/app/build.gradle

          echo "===== Gradle wrapper ====="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Commit Android platform files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android .metadata .gitignore

          if git diff --cached --quiet; then
            echo "No new Android files to commit."
          else
            git commit -m "Add Android platform files"
            git push origin HEAD:main
          fi
