name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate and Patch Android Project
        run: |
          # ۱. ایجاد پروژه اندروید
          flutter create --platforms=android --project-name hse_final_project .
          
          # ۲. تنظیم دقیق نسخه‌های SDK به 34 (کاملاً پایدار و سازگار با share_plus)
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle
          
          # ۳. ارتقای نسخه Android Gradle Plugin به نسخه پایدار 8.1.0
          sed -i 's/com.android.application" version ".*"/com.android.application" version "8.1.0"/g' android/settings.gradle
          sed -i 's/kotlin("android") version ".*"/kotlin("android") version "1.8.22"/g' android/settings.gradle
          
          # ۴. ارتقای نسخه Gradle Wrapper به 8.4 برای سازگاری کامل با جاوا ۱۷ و SDK 34
          sed -i 's/gradle-.*-all.zip/gradle-8.4-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hse-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
