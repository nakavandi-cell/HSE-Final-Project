name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # نسخه پایدار و جدید
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android Folder with SDK 35
        run: |
          flutter create --platforms=android --project-name hse_final_project .
          # اصلاح نسخه SDK به صورت خودکار برای رفع خطای share_plus
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hse-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
